[paths]
data_root = "data"
source = "source"
wav_master = "wav_master"
diarization = "diarization"
reference_bank = "reference_bank"
training_audio = "training_audio"
rvc_dataset = "rvc_dataset"
runs = "runs"

[models]
separator = "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
pyannote_pipeline = "pyannote/speaker-diarization-community-1"

[classification]
# Fallback only. Prefer profile-specific thresholds.json generated by
# calibrate_threshold.py.
accept_threshold = 0.4582
review_threshold = 0.4124
top_k = 5
min_score_duration = 2.0
max_score_duration = 20.0

[dataset_qc]
min_duration = 1.5
reject_rms_dbfs = -60.0
review_rms_low_dbfs = -45.0
review_rms_high_dbfs = -8.0
review_clipping_ratio = 0.005
review_dc_offset = 0.05
review_silence_ratio = 0.90
clip_level = 0.999
silence_level_dbfs = -50.0
