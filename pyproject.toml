[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localvoice-pipeline"
version = "0.1.0"
description = "Safe first-party pilot workflow for LocalVoice"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
asr-pilot = ["torch>=2.8", "numpy>=1.24,<3", "scipy>=1.10", "soundfile>=0.12", "transformers>=4.39,<5", "accelerate>=0.27"]
style-pilot = ["torch>=2.8", "numpy>=1.24,<3", "scipy>=1.10", "soundfile>=0.12", "transformers>=4.39,<5"]

[tool.setuptools.packages.find]
where = ["src"]
